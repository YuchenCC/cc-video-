<template id="scene-001-template">

      <section class="stage stage--split">
        <article id="s1-hub" class="panel panel--focus">

          <div class="icon-bubble"><img src="../assets/icons/java_logo.png" alt=""></div>
          <h2 class="panel-title">Safe Output</h2>
          <p class="panel-copy">统一执行脱敏、记录命中情况，并帮助程序员补齐规则。</p>
          <div class="metric"><strong>1</strong><span>套统一规则</span></div>
        </article>

        <div class="stage stage--three">
          <article id="s1-api" class="panel">
            <span class="panel-label">01</span>
            <div class="icon-bubble">API</div>
            <h2 class="panel-title">接口响应</h2>
            <p class="panel-copy">对象字段直接输出给调用方。</p>
          </article>
          <article id="s1-log" class="panel panel--risk">
            <span class="panel-label">02</span>
            <div class="icon-bubble">LOG</div>

            <p class="panel-copy">排障文本可能夹带敏感内容。</p>
          </article>
          <article id="s1-cross" class="panel">
            <span class="panel-label">03</span>
            <div class="icon-bubble">RPC</div>
            <h2 class="panel-title">跨系统调用</h2>
            <p class="panel-copy">上下游数据进入当前系统。</p>
          </article>
          <article id="s1-report" class="panel panel--success" style="grid-column: 1 / -1;">
            <span class="panel-label">GOVERNANCE REPORT</span>
            <h2 class="panel-title">记录字段、接口与命中次数</h2>
            <div class="chip-row">
              <span class="chip chip--success">发现漏项</span>
              <span class="chip chip--success">建议规则</span>
              <span class="chip chip--success">不保存原文</span>
            </div>
          </article>
        </div>
      </section>
    </main>
