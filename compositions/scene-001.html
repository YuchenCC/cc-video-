<template id="scene-001-template">
  <div
    id="scene-001"
    class="scene-root scene-001"
    data-composition-id="scene-001"
    data-width="1920"
    data-height="1080"
    data-start="0"
    data-duration="28"
  >
    <main class="concept-stage" data-layout-ignore>
      <div class="concept-zones" aria-hidden="true" data-layout-ignore>
        <div class="concept-zone concept-zone--left"></div>
        <div class="concept-zone concept-zone--center"></div>
        <div class="concept-zone concept-zone--right"></div>
      </div>

      <section id="s1-nested-concept" class="nested-concept" aria-label="Java 通用信息脱敏组件">
        <div id="s1-computer-shell" class="nested-icon nested-icon--computer">
          <img src="../assets/icons/computer.png" alt="">
        </div>
        <div id="s1-file-shell" class="nested-icon nested-icon--file">
          <img src="../assets/icons/file.png" alt="">
        </div>
        <div id="s1-java-shell" class="nested-icon nested-icon--java">
          <img src="../assets/icons/java_logo.png" alt="">
        </div>
      </section>

      <section
        id="s1-stack-frame"
        class="cc-stack-frame cc-stack-frame--blue concept-stack concept-stack--sequential entry-frame"
        aria-label="敏感信息入口"
        data-layout-ignore
      >
        <div class="cc-stack-frame__body">
          <div id="s1-row-api" class="concept-stack-row coverage-row">
            <div class="concept-stack-label-stage coverage-label-stage" data-layout-ignore>
              <div id="s1-old-api" class="cc-stack-label cc-stack-label--blue-light cc-stack-label--md coverage-label coverage-label--old">接口</div>
              <div id="s1-new-api" class="cc-stack-label cc-stack-label--teal-light cc-stack-label--md coverage-label coverage-label--new">覆盖接口响应</div>
            </div>
            <span id="s1-check-api" class="cc-check-badge cc-check-badge--green cc-check-badge--md cc-check-badge--static coverage-check">
              <svg class="cc-check-badge__icon" viewBox="0 0 64 64" fill="none" role="img" aria-label="接口响应已覆盖">
                <path class="cc-check-badge__mark" d="M18 33.5L28.5 44L47 21"></path>
              </svg>
            </span>
          </div>

          <div id="s1-row-log" class="concept-stack-row coverage-row">
            <div class="concept-stack-label-stage coverage-label-stage" data-layout-ignore>
              <div id="s1-old-log" class="cc-stack-label cc-stack-label--coral-dark cc-stack-label--md coverage-label coverage-label--old">日志</div>
              <div id="s1-new-log" class="cc-stack-label cc-stack-label--teal-light cc-stack-label--md coverage-label coverage-label--new">覆盖日志输出</div>
            </div>
            <span id="s1-check-log" class="cc-check-badge cc-check-badge--green cc-check-badge--md cc-check-badge--static coverage-check">
              <svg class="cc-check-badge__icon" viewBox="0 0 64 64" fill="none" role="img" aria-label="日志输出已覆盖">
                <path class="cc-check-badge__mark" d="M18 33.5L28.5 44L47 21"></path>
              </svg>
            </span>
          </div>

          <div id="s1-row-cross" class="concept-stack-row coverage-row">
            <div class="concept-stack-label-stage coverage-label-stage" data-layout-ignore>
              <div id="s1-old-cross" class="cc-stack-label cc-stack-label--blue-light cc-stack-label--md coverage-label coverage-label--old">跨系统调用</div>
              <div id="s1-new-cross" class="cc-stack-label cc-stack-label--teal-light cc-stack-label--md coverage-label coverage-label--new">主动脱敏</div>
            </div>
            <span id="s1-check-cross" class="cc-check-badge cc-check-badge--green cc-check-badge--md cc-check-badge--static coverage-check">
              <svg class="cc-check-badge__icon" viewBox="0 0 64 64" fill="none" role="img" aria-label="主动脱敏已覆盖">
                <path class="cc-check-badge__mark" d="M18 33.5L28.5 44L47 21"></path>
              </svg>
            </span>
          </div>
        </div>
      </section>

      <section id="s1-plug-concept" class="plug-concept" aria-label="接入 Java 脱敏组件">
        <img src="../assets/icons/plug.png" alt="">
      </section>

      <img id="s1-character-tired" class="scene-character" src="../assets/characters/9.png" alt="疲惫等待的程序员">
      <img id="s1-character-success" class="scene-character" src="../assets/characters/17.png" alt="成功振奋的程序员">
    </main>

    <div class="caption" data-layout-allow-overlap>这是一个 Java 通用信息脱敏组件</div>
    <div class="caption" data-layout-allow-overlap>敏感字段可能分散在多个输出入口</div>
    <div class="caption" data-layout-allow-overlap>人工逐个排查工作量大，也容易遗漏</div>
    <div class="caption" data-layout-allow-overlap>接入组件后统一覆盖三类使用场景</div>
    <div class="caption" data-layout-allow-overlap>脱敏记录会继续帮助程序员补齐规则</div>

    <style>
      @import url("../src/styles/runtime.css");
      @import url("../src/components/StackFrame/styles.css");
      @import url("../src/components/StackLabel/styles.css");
      @import url("../src/components/CheckBadge/styles.css");

      #scene-001 {
        background: #f7f8fa;
      }

      #scene-001::before {
        opacity: 0.48;
      }

      #scene-001 .concept-stage {
        --concept-left-width: 25%;
        --concept-center-width: 50%;
        --concept-right-width: 25%;
        --concept-top-padding: 194px;
        --concept-bottom-padding: 324px;
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #scene-001 .concept-zones {
        position: absolute;
        z-index: 0;
        inset: 0;
        display: grid;
        grid-template-columns:
          var(--concept-left-width)
          var(--concept-center-width)
          var(--concept-right-width);
        padding-top: var(--concept-top-padding);
        padding-bottom: var(--concept-bottom-padding);
        pointer-events: none;
      }

      #scene-001 .concept-zone {
        min-width: 0;
        min-height: 0;
      }

      #scene-001 .concept-stage::after {
        content: "";
        position: absolute;
        z-index: 0;
        top: 164px;
        left: 50%;
        width: 920px;
        height: 720px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(44, 154, 154, 0.11), rgba(44, 154, 154, 0) 68%);
        transform: translateX(-50%);
        pointer-events: none;
      }

      #scene-001 .nested-concept,
      #scene-001 .plug-concept {
        position: absolute;
        z-index: 3;
        top: 194px;
        left: 560px;
        width: 800px;
        height: 440px;
      }

      #scene-001 .nested-concept {
        opacity: 0;
      }

      #scene-001 .nested-icon {
        position: absolute;
        display: grid;
        place-items: center;
        opacity: 1;
      }

      #scene-001 .nested-icon img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      #scene-001 .nested-icon--computer {
        inset: 0;
      }

      #scene-001 .nested-icon--file {
        top: 102px;
        left: 150px;
        width: 480px;
        height: 480px;
      }

      #scene-001 .nested-icon--java {
        top: 220px;
        left: 280px;
        width: 220px;
        height: 220px;
      }

      #scene-001 .entry-frame {
        --s1-stack-label-width: 460px;
        --s1-stack-frame-extra-width: 86px;
        position: absolute;
        z-index: 3;
        top: 230px;
        left: 50%;
        width: calc(var(--s1-stack-label-width) + var(--s1-stack-frame-extra-width));
        min-width: 0;
        max-width: 960px;
        translate: -50% 0;
        opacity: 0;
        transform-origin: center center;
      }

      #scene-001 .entry-frame .cc-stack-frame__body {
        display: grid;
        width: calc(var(--s1-stack-label-width) + var(--s1-stack-frame-extra-width));
        max-width: 960px;
        justify-items: stretch;
        gap: 22px;
        padding: 38px;
        border-width: 5px;
        border-radius: 32px;
      }

      #scene-001 .coverage-row {
        position: relative;
        display: block;
        width: var(--s1-stack-label-width);
        opacity: 0;
        transform-origin: center center;
      }

      #scene-001 .coverage-label-stage {
        display: grid;
        width: var(--s1-stack-label-width);
        height: 104px;
      }

      #scene-001 .coverage-label {
        grid-area: 1 / 1;
        width: 100%;
        min-width: 0;
        min-height: 104px;
        padding-right: 116px;
        font-size: 42px;
        border-radius: 28px;
      }

      #scene-001 .coverage-label--new,
      #scene-001 .coverage-check {
        opacity: 0;
      }

      #scene-001 .coverage-check {
        position: absolute;
        top: 50%;
        right: 16px;
        width: 72px;
        translate: 0 -50%;
        transform-origin: center center;
      }

      #scene-001 .coverage-check .cc-check-badge__mark {
        stroke-dashoffset: 48;
      }

      #scene-001 .plug-concept {
        display: grid;
        place-items: center;
        top: 182px;
        left: 1168px;
        width: 132px;
        height: 132px;
        opacity: 0;
        transform-origin: center center;
      }

      #scene-001 .plug-concept img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center top;
        filter: drop-shadow(0 24px 34px rgba(47, 111, 143, 0.18));
      }

      #scene-001 .scene-character {
        position: absolute;
        z-index: 4;
        top: 210px;
        right: 50px;
        width: 380px;
        height: 520px;
        object-fit: contain;
        object-position: bottom center;
        opacity: 0;
      }

      #scene-001 .caption {
        z-index: 8;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};

      var tl = gsap.timeline({ paused: true });
      var captions = document.querySelectorAll("#scene-001 .caption");
      var oldLabels = ["#s1-old-api", "#s1-old-log", "#s1-old-cross"];
      var newLabels = ["#s1-new-api", "#s1-new-log", "#s1-new-cross"];
      var rows = ["#s1-row-api", "#s1-row-log", "#s1-row-cross"];
      var checks = ["#s1-check-api", "#s1-check-log", "#s1-check-cross"];

      tl.fromTo(
        "#s1-nested-concept",
        { opacity: 0, scale: 0.82 },
        { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.25)", immediateRender: false },
        0.2
      );
      tl.to(
        "#s1-nested-concept",
        { opacity: 0, scale: 0.92, duration: 0.55, ease: "power2.in" },
        4.3
      );

      tl.fromTo(
        "#s1-stack-frame",
        { opacity: 0, scale: 0.9 },
        { opacity: 1, scale: 1, duration: 0.65, ease: "power3.out", immediateRender: false },
        5
      );
      rows.forEach(function (selector, index) {
        tl.fromTo(
          selector,
          { opacity: 0, y: 28 },
          {
            opacity: 1,
            y: 0,
            duration: 0.48,
            ease: index === 0 ? "power2.out" : index === 1 ? "circ.out" : "expo.out",
            immediateRender: false
          },
          5.8 + index * 1.15
        );
      });

      tl.fromTo(
        "#s1-character-tired",
        { opacity: 0, x: 48, y: 20, scale: 0.92 },
        { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.65, ease: "power3.out", immediateRender: false },
        10
      );
      tl.to(
        "#s1-stack-frame",
        { scale: 1.025, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 1 },
        11.1
      );

      tl.to(
        "#s1-stack-frame",
        { scale: 1.035, duration: 0.38, ease: "sine.inOut", yoyo: true, repeat: 1 },
        15
      );
      tl.fromTo(
        "#s1-plug-concept",
        { opacity: 0, x: 310, y: -210, scale: 0.46, rotation: 8 },
        {
          opacity: 1,
          x: 0,
          y: 0,
          scale: 1,
          rotation: 0,
          duration: 0.85,
          ease: "expo.out",
          immediateRender: false
        },
        15.15
      );
      tl.to(
        "#s1-stack-frame .cc-stack-frame__body",
        { borderColor: "#2C9A9A", duration: 0.45, ease: "power1.inOut" },
        15.55
      );

      oldLabels.forEach(function (oldSelector, index) {
        var newSelector = newLabels[index];
        var rowSelector = rows[index];
        var checkSelector = checks[index];
        var start = 16.4 + index * 1.45;

        tl.to(
          rowSelector,
          { opacity: 1, scale: 1.035, duration: 0.28, ease: "power2.out", overwrite: "auto" },
          start
        );
        tl.to(
          oldSelector,
          { opacity: 0, scale: 0.9, duration: 0.28, ease: "power2.in", overwrite: "auto" },
          start
        );
        tl.fromTo(
          newSelector,
          { opacity: 0, scale: 0.9 },
          { opacity: 1, scale: 1, duration: 0.38, ease: "back.out(1.2)", overwrite: "auto", immediateRender: false },
          start + 0.18
        );
        tl.fromTo(
          checkSelector,
          { opacity: 0, scale: 0.72 },
          { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(1.35)", overwrite: "auto", immediateRender: false },
          start + 0.32
        );
        tl.to(
          checkSelector + " .cc-check-badge__mark",
          { strokeDashoffset: 0, duration: 0.5, ease: "power2.out", overwrite: "auto" },
          start + 0.42
        );
        tl.to(
          rowSelector,
          { opacity: 0.35, scale: 1, duration: 0.35, ease: "power1.inOut", overwrite: "auto" },
          start + 1.05
        );
      });

      tl.to(
        rows.join(", "),
        { opacity: 1, duration: 0.4, ease: "power1.inOut", overwrite: "auto" },
        20.65
      );

      tl.to(
        "#s1-character-tired",
        { opacity: 0, x: 34, scale: 0.94, duration: 0.4, ease: "power2.in" },
        20.8
      );
      tl.fromTo(
        "#s1-character-success",
        { opacity: 0, x: 44, y: 18, scale: 0.9 },
        { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.6, ease: "back.out(1.2)", immediateRender: false },
        21.05
      );
      tl.to(
        "#s1-plug-concept",
        {
          scale: 1.035,
          duration: 0.55,
          ease: "sine.inOut",
          yoyo: true,
          repeat: 1
        },
        21.2
      );

      [
        [0, 0.6, 4.8],
        [1, 5, 9.8],
        [2, 10, 14.8],
        [3, 15, 21.8],
        [4, 22, 27.6]
      ].forEach(function (item) {
        tl.fromTo(
          captions[item[0]],
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.3, ease: "power2.out", overwrite: "auto", immediateRender: false },
          item[1]
        );
        tl.to(
          captions[item[0]],
          { opacity: 0, duration: 0.22, ease: "power2.in", overwrite: "auto" },
          item[2]
        );
      });

      window.__timelines["scene-001"] = tl;
    </script>
  </div>
</template>
