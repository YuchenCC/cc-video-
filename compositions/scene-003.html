<template id="scene-003-template">

      <section class="stage stage--split">

          <div class="layer"><span class="layer-index">01</span><strong>基础能力 · 常见字段规则</strong></div>

          <div class="layer"><span class="layer-index">03</span><strong>例外能力 · 保留原值并记录</strong></div>
          <div class="layer"><span class="layer-index">04</span><strong>自定义能力 · 特殊数据策略</strong></div>
        </div>

        <div class="stage">
          <article id="s3-basic" class="panel panel--focus">
            <span class="panel-label">BUILT-IN</span>
            <h2 class="panel-title">常见敏感字段开箱即用</h2>

              <span class="chip">证件号</span>
              <span class="chip">银行卡号</span>

          </article>
          <div class="stage stage--three">
            <article id="s3-enhance" class="panel"><span class="panel-label">ENHANCE</span><h2 class="panel-title">复杂命名与层级</h2></article>
            <article id="s3-exception" class="panel panel--risk"><span class="panel-label">EXCEPTION</span><h2 class="panel-title">明确保留原值</h2></article>
            <article id="s3-custom" class="panel panel--success"><span class="panel-label">PLUGIN</span><h2 class="panel-title">业务自定义策略</h2></article>
          </div>
          <article id="s3-stats" class="panel panel--success">
            <span class="panel-label">SHARED STATISTICS</span>
            <h2 class="panel-title">所有扩展继续复用统一规则与统计能力</h2>
          </article>
        </div>
      </section>
    </main>

    <div class="caption" data-layout-allow-overlap>配置分为四个层次</div>
    <div class="caption" data-layout-allow-overlap>基础规则直接覆盖五类常见敏感字段</div>
    <div class="caption" data-layout-allow-overlap>增强规则处理命名不统一和复杂层级</div>
    <div class="caption" data-layout-allow-overlap>例外配置允许保留原值并留下记录</div>
    <div class="caption" data-layout-allow-overlap>自定义策略仍复用统一规则和统计</div>

    <style>
