      <p class="scene-kicker">有字段名时复用接口规则；没有字段名时，只对边界明确的数据做兜底识别。</p>

      <section class="stage stage--split">
        <div class="stage">
          <div class="stage stage--three">
            <article id="s4-up" class="panel"><span class="panel-label">UPSTREAM</span><h2 class="panel-title">上游参数</h2></article>

            <article id="s4-down" class="panel"><span class="panel-label">DOWNSTREAM</span><h2 class="panel-title">下游返回</h2></article>
          </div>
          <div id="s4-terminal" class="terminal">
            <div class="terminal-head">
              <span class="terminal-dot"></span><span class="terminal-dot"></span><span class="terminal-dot"></span>
            </div>
            <pre class="terminal-body"><span class="terminal-line">INFO request user.mobile=138****0000</span><span class="terminal-line">DEBUG downstream response payload=...</span><span class="terminal-line terminal-line--hot">WARN raw text contains 110***********1234</span></pre>
          </div>
        </div>

        <div class="stage">
          <article id="s4-fields" class="panel panel--success">
            <span class="panel-label">STRUCTURED LOG</span>
            <h2 class="panel-title">有字段名：复用接口配置</h2>
            <div class="chip-row">
              <span class="chip chip--success">user.mobile</span>
              <span class="chip chip--success">customer.email</span>
            </div>
          </article>
          <article id="s4-fallback" class="panel panel--risk">
            <span class="panel-label">PLAIN TEXT</span>
            <h2 class="panel-title">无字段名：进入兜底检测器</h2>
            <div class="chip-row">
              <span class="chip chip--risk">手机号</span>
              <span class="chip chip--risk">证件号</span>
              <span class="chip chip--risk">邮箱</span>
            </div>
          </article>
          <article id="s4-performance" class="panel">
            <span class="panel-label">PERFORMANCE BOUNDARY</span>
            <div class="metric"><strong>3</strong><span>类边界明确的数据</span></div>
            <p class="panel-copy">不是全量扫描，尽量控制对日志性能的影响。</p>
          </article>
        </div>
      </section>
    </main>

    <div class="caption" data-layout-allow-overlap>日志往往是最难治理的地方</div>
    <div class="caption" data-layout-allow-overlap>上游、本系统和下游内容都可能被直接打印</div>
    <div class="caption" data-layout-allow-overlap>只靠人工梳理，很难保证没有遗漏</div>
    <div class="caption" data-layout-allow-overlap>有明确字段名时直接复用接口脱敏配置</div>
    <div class="caption" data-layout-allow-overlap>整段文本没有字段名时使用兜底识别</div>
    <div class="caption" data-layout-allow-overlap>兜底只处理边界明确的数据类型</div>
