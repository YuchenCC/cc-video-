      .root-watermark {

        z-index: 100;
        top: 28px;
        right: 38px;

        color: #6F7C88;

        font-weight: 700;
        opacity: 0.76;
        pointer-events: none;
      }

      .root-watermark img {
        width: auto;
        height: 28px;
      }

      .chapter-wipe {
        position: absolute;
        z-index: 90;
        inset: 0;
        background: #2F6F8F;
        transform: scaleX(0);
        transform-origin: left center;
        pointer-events: none;
      }

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var boundaries = [27.6, 64.7, 98.8, 151.9, 228];
      var colors = ["#2F6F8F", "#2C9A9A", "#EF7B85", "#233B5E", "#2C9A9A"];

      tl.set(".root-watermark", { scale: 2, transformOrigin: "right top" }, 0);
      tl.set(".root-watermark", { scale: 2, transformOrigin: "right top" }, 27.8);
      tl.fromTo("#scene-005-demo-video", { opacity: 0 }, { opacity: 1, duration: 0.48, ease: "power2.out" }, 154.58);

      boundaries.forEach(function (time, index) {
        tl.set("#chapter-wipe", { backgroundColor: colors[index], transformOrigin: "left center" }, time);
        tl.fromTo("#chapter-wipe", { scaleX: 0 }, { scaleX: 1, duration: 0.2, ease: "power2.in", overwrite: "auto" }, time);
        tl.set("#chapter-wipe", { transformOrigin: "right center" }, time + 0.2);
        tl.to("#chapter-wipe", { scaleX: 0, duration: 0.2, ease: "power2.out", overwrite: "auto" }, time + 0.2);
      });

      window.__timelines.main = tl;
